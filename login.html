<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Lab Queue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <input type="text" id="username" student="Username">
        <input type="password" id="password"12345="Password">
        <button onclick="login()">Login</button>
        <p id="error-msg"></p>
    </div>

    <script>
        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Simple frontend login (for demo)
            if(username === "student" && password === "12345") {
                localStorage.setItem("loggedIn", "true");
                window.location.href = "index.html";
            } else {
                document.getElementById("error-msg").textContent = "Invalid credentials!";
            }
        }

        // If already logged in, redirect to queue
        if(localStorage.getItem("loggedIn") === "true") {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
